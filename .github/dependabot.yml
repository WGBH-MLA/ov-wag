version: 2
updates:
# GitHub Actions
- package-ecosystem: github-actions
  directory: .github/workflows
  schedule:
    interval: weekly
    day: wednesday
    time: '06:00'
    timezone: US/Eastern
  commit-message:
    prefix: ⬆
  labels:
  - maintenance 🔧
  groups:
    artifacts:
      patterns:
      - actions/upload-artifact
      - actions/download-artifact

# uv
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
    day: wednesday
    time: '06:00'
    timezone: US/Eastern
  commit-message:
    prefix: ⬆
  cooldown:
    default-days: 3
    semver-major-days: 7
  labels:
  - maintenance 🔧
  groups:
    cli:
      patterns:
      - typer
      - trogon
      - loguru
      - rich
    dev:
      dependency-type: development
      update-types:
      - minor
      - patch
      patterns:
      - uv
      - uvx
      - ruff
      - black
    django:
      dependency-type: production
      update-types:
      - minor
      - patch
      patterns:
      - django
      - django-*
    docs:
      patterns:
      - mkdocs
      - mkdocs-*
      - mkdocstrings
      - mike
    test:
      dependency-type: development
      update-types:
      - minor
      - patch
      patterns:
      - pytest
      - pytest-*
      - nbmake
      - coverage
      - wagtail-factories
    wagtail:
      patterns:
      - wagtail
      - wagtail-*
